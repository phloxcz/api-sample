name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: [sqlite]
        include:
          - database: sqlite
            image: ''
            port: ''
            dsn: ''
            user: ''
            password: ''
    steps:
      - uses: actions/checkout@v4
        with:
          path: phlox-api-sample
      - name: Checkout phloxcz/api-core, which composer.json takes from ../phlox-api-core
        uses: actions/checkout@v4
        with:
          repository: phloxcz/api-core
          path: phlox-api-core
      - name: Checkout phloxcz/api-query, which composer.json takes from ../phlox-api-query
        uses: actions/checkout@v4
        with:
          repository: phloxcz/api-query
          path: phlox-api-query
      - name: Checkout phloxcz/entity-database, which composer.json takes from ../phlox-entity-database
        uses: actions/checkout@v4
        with:
          repository: phloxcz/entity-database
          path: phlox-entity-database
      - name: Checkout phloxcz/rest-api, which composer.json takes from ../phlox-rest-api
        uses: actions/checkout@v4
        with:
          repository: phloxcz/rest-api
          path: phlox-rest-api
      - name: Checkout phloxcz/rpc-api, which composer.json takes from ../phlox-rpc-api
        uses: actions/checkout@v4
        with:
          repository: phloxcz/rpc-api
          path: phlox-rpc-api
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - name: Install
        working-directory: phlox-api-sample
        run: composer install --no-interaction --no-progress
      - name: Tests
        working-directory: phlox-api-sample
        env:
          TEST_DSN: ${{ matrix.dsn }}
          TEST_USER: ${{ matrix.user }}
          TEST_PASSWORD: ${{ matrix.password }}
        run: vendor/bin/tester tests -C -j 1
